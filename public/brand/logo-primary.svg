<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="BadaMangal — गदा at the heart of an 8-rayed sun">
  <title>BadaMangal Logo</title>
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2944C"/>
      <stop offset="100%" stop-color="#E07A1F"/>
    </radialGradient>
    <linearGradient id="gadaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A24A"/>
      <stop offset="100%" stop-color="#A07F2C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Outer 8-pointed compass: 8 long rays for the 8 Bada Mangals -->
  <g transform="translate(240 240)">
    <!-- 8 long rays, each rotated 45° -->
    <g fill="#C9A24A" opacity="0.85">
      <polygon points="0,-220 12,-150 -12,-150"/>
      <g transform="rotate(45)"><polygon points="0,-220 12,-150 -12,-150"/></g>
      <g transform="rotate(90)"><polygon points="0,-220 12,-150 -12,-150"/></g>
      <g transform="rotate(135)"><polygon points="0,-220 12,-150 -12,-150"/></g>
      <g transform="rotate(180)"><polygon points="0,-220 12,-150 -12,-150"/></g>
      <g transform="rotate(225)"><polygon points="0,-220 12,-150 -12,-150"/></g>
      <g transform="rotate(270)"><polygon points="0,-220 12,-150 -12,-150"/></g>
      <g transform="rotate(315)"><polygon points="0,-220 12,-150 -12,-150"/></g>
    </g>
    <!-- 8 short rays between -->
    <g fill="#C9A24A" opacity="0.55">
      <g transform="rotate(22.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(67.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(112.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(157.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(202.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(247.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(292.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
      <g transform="rotate(337.5)"><polygon points="0,-180 8,-130 -8,-130"/></g>
    </g>

    <!-- Sun disc -->
    <circle r="140" fill="url(#sunGrad)"/>
    <!-- gold inner ring -->
    <circle r="140" fill="none" stroke="#C9A24A" stroke-width="3"/>
    <circle r="125" fill="none" stroke="#9C2A2A" stroke-width="1.5" opacity="0.5"/>

    <!-- Stylized gada (mace) - vertical -->
    <g>
      <!-- top ornament knob -->
      <circle cx="0" cy="-92" r="9" fill="url(#gadaGrad)"/>
      <!-- gada head: chunky bell shape -->
      <path d="
        M -42 -88
        C -42 -110, -22 -120, 0 -120
        C 22 -120, 42 -110, 42 -88
        L 42 -50
        C 42 -28, 22 -18, 0 -18
        C -22 -18, -42 -28, -42 -50
        Z" fill="url(#gadaGrad)" stroke="#9C2A2A" stroke-width="2"/>
      <!-- decorative bands on head -->
      <line x1="-42" y1="-78" x2="42" y2="-78" stroke="#9C2A2A" stroke-width="2" opacity="0.6"/>
      <line x1="-42" y1="-58" x2="42" y2="-58" stroke="#9C2A2A" stroke-width="2" opacity="0.6"/>
      <!-- tiny diamond accents -->
      <g fill="#9C2A2A">
        <circle cx="0" cy="-90" r="3"/>
        <circle cx="-22" cy="-68" r="2"/>
        <circle cx="22" cy="-68" r="2"/>
        <circle cx="0" cy="-46" r="2.5"/>
      </g>

      <!-- shaft -->
      <rect x="-7" y="-18" width="14" height="100" fill="url(#gadaGrad)" stroke="#9C2A2A" stroke-width="1.5"/>
      <!-- shaft binding -->
      <rect x="-9" y="20" width="18" height="6" fill="#9C2A2A"/>
      <rect x="-9" y="50" width="18" height="6" fill="#9C2A2A"/>

      <!-- bottom pommel -->
      <circle cx="0" cy="92" r="14" fill="url(#gadaGrad)" stroke="#9C2A2A" stroke-width="2"/>
      <circle cx="0" cy="92" r="5" fill="#9C2A2A"/>
    </g>
  </g>

  <!-- Devanagari wordmark -->
  <text x="240" y="500"
        text-anchor="middle"
        font-family="'Tiro Devanagari Hindi','Mukta',serif"
        font-size="56"
        fill="#9C2A2A"
        letter-spacing="2">बड़ा मंगल</text>

  <!-- English sub-wordmark -->
  <text x="240" y="540"
        text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond',serif"
        font-size="20"
        font-style="italic"
        fill="#5A4F46"
        letter-spacing="6">B A D A   M A N G A L</text>
</svg>
